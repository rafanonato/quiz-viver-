<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz — Apresentador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="screen" id="setup" hidden>
    <h1>Painel do apresentador</h1>
    <p class="error" id="setupError"></p>
    <button class="big" id="createBtn">Criar novo jogo</button>
    <a href="admin.html" class="muted">Editar perguntas e tempos</a>
  </main>

  <main class="screen" id="lobby" hidden>
    <div class="lobby-main">
      <img id="qr" class="qr" alt="QR code para entrar no jogo" src="/api/qr.svg">
      <div class="lobby-info">
        <p class="muted">Escaneie o QR code ou acesse</p>
        <p class="join-url" id="joinUrl"></p>
        <p class="muted" style="margin-top:14px">PIN</p>
        <p class="pin" id="bigPin"></p>
      </div>
    </div>
    <p id="lobbyCount" style="font-size:1.2rem;"></p>
    <div class="chips" id="names"></div>
    <button class="big" id="startBtn" disabled>Começar</button>
    <button class="secondary end-btn" style="border-radius:10px;padding:10px 18px;">Encerrar jogo</button>
  </main>

  <main class="screen" id="question" hidden>
    <div style="display:flex;justify-content:space-between;align-items:center;width:min(95vw,920px);">
      <span class="count" id="hQ"></span>
      <span class="timer" id="hTimer"></span>
      <span class="count" id="hAnswered"></span>
    </div>
    <p class="question-text" id="hText"></p>
    <div class="tiles" id="hTiles"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
      <button class="big reveal-btn">Revelar resposta agora</button>
      <button class="secondary end-btn" style="border-radius:10px;padding:10px 18px;">Encerrar jogo</button>
    </div>
  </main>

  <main class="screen" id="reveal" hidden>
    <p class="count" id="rCount"></p>
    <p class="question-text" id="rText"></p>
    <div class="tiles" id="rTiles"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
      <button class="big rank-btn">Ver ranking</button>
      <button class="big secondary next-btn">Próxima pergunta</button>
      <button class="secondary end-btn" style="border-radius:10px;padding:10px 18px;">Encerrar jogo</button>
    </div>
  </main>

  <main class="screen" id="ranking" hidden>
    <h2>Ranking</h2>
    <ol class="board" id="rankList"></ol>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
      <button class="big next-btn">Próxima pergunta</button>
      <button class="secondary end-btn" style="border-radius:10px;padding:10px 18px;">Encerrar jogo</button>
    </div>
  </main>

  <main class="screen podium-screen" id="podium" hidden>
    <p class="count">Pódio final</p>
    <div class="stage" id="podiumStage">
      <div class="slot" data-place="2"><div class="medal">🥈</div><div class="pname"></div><div class="pscore"></div><div class="block">2</div></div>
      <div class="slot" data-place="1"><div class="medal">🥇</div><div class="pname"></div><div class="pscore"></div><div class="block">1</div></div>
      <div class="slot" data-place="3"><div class="medal">🥉</div><div class="pname"></div><div class="pscore"></div><div class="block">3</div></div>
    </div>
    <div class="confetti" id="confetti"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
      <button class="big" id="revealPodiumBtn">⬆ Revelar 3º lugar</button>
      <button class="big" id="finishBtn" hidden>Finalizar jogo</button>
    </div>
  </main>

  <main class="screen podium-screen" id="end" hidden>
    <p class="count">Pódio final</p>
    <div class="stage" id="finalStage">
      <div class="slot" data-place="2"><div class="medal">🥈</div><div class="pname"></div><div class="pscore"></div><div class="block">2</div></div>
      <div class="slot" data-place="1"><div class="medal">🥇</div><div class="pname"></div><div class="pscore"></div><div class="block">1</div></div>
      <div class="slot" data-place="3"><div class="medal">🥉</div><div class="pname"></div><div class="pscore"></div><div class="block">3</div></div>
    </div>
    <button class="big" id="newBtn">Novo jogo</button>
  </main>

  <script src="common.js"></script>
  <script src="host.js"></script>
</body>
</html>
